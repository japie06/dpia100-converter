name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # windows-latest has Windows PowerShell 5.1 (powershell), PowerShell 7 (pwsh) and Microsoft Edge.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regression suite (PS 5.1, PS 7 and the web page in Edge)
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Differential test (dpia100.ps1 against dpia100.html on random input)
        shell: pwsh
        # A new seed per run widens the coverage over time; a failure prints the seed to rerun it locally.
        run: ./tests/web/differential.ps1 -Count 40 -Seed ${{ github.run_number }}
      - name: Rubriek tools (cleaner and generator of the standard rubrieken, on a synthetic export)
        shell: pwsh
        run: ./tests/rubrieken/run-tests.ps1

  web:
    # Unit tests (node:test) and UI tests (Playwright) of dpia100.html in the preinstalled Edge.
    # No browser is downloaded: Playwright uses channel 'msedge' (playwright.config.mjs).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install test tooling
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit and UI tests
        run: npm test
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/out/playwright-report
            tests/out/playwright

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches $ScriptVersion and the page version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ((Get-Content dpia100.ps1 -Raw) -notmatch "\`$ScriptVersion = '([^']+)'") { throw 'ScriptVersion not found' }
          if ("v$($Matches[1])" -ne $tag) { throw "Tag $tag does not match ScriptVersion $($Matches[1])" }
          if ((Get-Content dpia100.html -Raw) -notmatch "const VERSION = '([^']+)'") { throw 'VERSION not found in dpia100.html' }
          if ("v$($Matches[1])" -ne $tag) { throw "Tag $tag does not match the VERSION $($Matches[1]) in dpia100.html" }
      - name: Build zip
        shell: pwsh
        run: |
          $name = "dpia100-converter-${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item dpia100.html, dpia100.ps1, dpia100.bat, voorbeeld.csv, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          # The section from '## <tag> ' up to the next '## ' heading.
          $tag = '${{ github.ref_name }}'
          $notes = [System.Collections.Generic.List[string]]::new()
          $inSection = $false
          foreach ($line in Get-Content docs/CHANGELOG.md) {
              if ($line -match '^## ') { $inSection = $line.StartsWith("## $tag ") ; continue }
              if ($inSection) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "No section '## $tag ' in docs/CHANGELOG.md" }
          Set-Content notes.md ($notes -join "`n").Trim()
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "dpia100-converter-${{ github.ref_name }}.zip" --title '${{ github.ref_name }}' --notes-file notes.md

  pages:
    # Publishes the released dpia100.html as https://japie06.github.io/dpia100-converter/, so the hosted
    # page always equals the latest release. One-time setup: Settings > Pages > Source: GitHub Actions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the site
        run: |
          mkdir _site
          cp dpia100.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
