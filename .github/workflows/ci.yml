name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # windows-latest has both Windows PowerShell 5.1 (powershell) and PowerShell 7 (pwsh).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run regression suite (PS 5.1 and 7)
        shell: pwsh
        run: ./tests/run-tests.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches $ScriptVersion
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ((Get-Content dpia100.ps1 -Raw) -notmatch "\`$ScriptVersion = '([^']+)'") { throw 'ScriptVersion not found' }
          if ("v$($Matches[1])" -ne $tag) { throw "Tag $tag does not match ScriptVersion $($Matches[1])" }
      - name: Build zip
        shell: pwsh
        run: |
          $name = "dpia100-converter-${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item dpia100.ps1, dpia100.bat, voorbeeld.csv, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          # The section from '## <tag> ' up to the next '## ' heading.
          $tag = '${{ github.ref_name }}'
          $notes = [System.Collections.Generic.List[string]]::new()
          $inSection = $false
          foreach ($line in Get-Content docs/CHANGELOG.md) {
              if ($line -match '^## ') { $inSection = $line.StartsWith("## $tag ") ; continue }
              if ($inSection) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "No section '## $tag ' in docs/CHANGELOG.md" }
          Set-Content notes.md ($notes -join "`n").Trim()
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "dpia100-converter-${{ github.ref_name }}.zip" --title '${{ github.ref_name }}' --notes-file notes.md
